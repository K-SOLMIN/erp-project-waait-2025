services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: waait-oracle
    ports:
      - "1521:1521"
    environment:
      # SYS/SYSTEM 계정 비밀번호
      ORACLE_PASSWORD: oracle
      # application.properties 의 spring.datasource.username/password 와 동일하게 앱 계정 자동 생성
      APP_USER: waait
      APP_USER_PASSWORD: waait
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  oracle-data:
